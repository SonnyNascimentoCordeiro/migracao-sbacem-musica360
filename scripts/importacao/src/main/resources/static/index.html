<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Importação SBACEM</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: monospace; background: #1a1a2e; color: #e0e0e0; padding: 20px; }
        h1 { color: #00d4ff; margin-bottom: 20px; font-size: 1.4rem; }
        .toolbar { display: flex; gap: 10px; margin-bottom: 20px; }
        input { padding: 8px 12px; background: #16213e; border: 1px solid #0f3460; color: #e0e0e0; border-radius: 4px; font-family: monospace; width: 200px; }
        button { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-family: monospace; font-weight: bold; }
        .btn-preview { background: #00d4ff; color: #1a1a2e; }
        .btn-import { background: #e94560; color: white; }
        .btn-preview:hover { background: #00b8d9; }
        .btn-import:hover { background: #c73652; }
        .obra-info { background: #16213e; border: 1px solid #0f3460; border-radius: 6px; padding: 16px; margin-bottom: 20px; }
        .obra-info h2 { color: #00d4ff; font-size: 1.1rem; margin-bottom: 8px; }
        .obra-meta { display: flex; gap: 30px; font-size: 0.85rem; color: #aaa; }
        .controle { color: #f39c12; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
        th { background: #0f3460; color: #00d4ff; padding: 8px; text-align: left; }
        td { padding: 6px 8px; border-bottom: 1px solid #0f3460; }
        tr:hover td { background: #1e2a4a; }
        .link-badge { display: inline-block; width: 24px; height: 24px; border-radius: 50%; text-align: center; line-height: 24px; font-weight: bold; font-size: 0.75rem; }
        .ctrl-true { color: #2ecc71; }
        .ctrl-false { color: #555; }
        .cat { padding: 2px 6px; border-radius: 3px; font-size: 0.75rem; font-weight: bold; }
        .cat-CA { background: #2c3e50; color: #3498db; }
        .cat-E  { background: #2c3e50; color: #e67e22; }
        .cat-AM { background: #2c3e50; color: #9b59b6; }
        .cat-SE { background: #2c3e50; color: #e74c3c; }
        .pct { text-align: right; }
        .pct-mr { color: #2ecc71; }
        .pct-pr { color: #3498db; }
        .pct-coleta { color: #f39c12; }
        .pct-fono { color: #9b59b6; }
        .msg { padding: 12px; border-radius: 4px; margin-bottom: 16px; }
        .msg-error { background: #e945601a; border: 1px solid #e94560; color: #e94560; }
        .msg-ok { background: #2ecc711a; border: 1px solid #2ecc71; color: #2ecc71; }
        .section { margin-bottom: 16px; }
        .alts { color: #aaa; font-size: 0.8rem; margin-top: 6px; }
        .totals { background: #0f3460; font-weight: bold; }
        #loading { color: #00d4ff; display: none; }

        /* Cores dos links */
        .link-1 { background: #e74c3c; color: white; }
        .link-2 { background: #3498db; color: white; }
        .link-3 { background: #2ecc71; color: #1a1a2e; }
        .link-4 { background: #f39c12; color: #1a1a2e; }
        .link-5 { background: #9b59b6; color: white; }
        .link-6 { background: #1abc9c; color: #1a1a2e; }
        .link-7 { background: #e67e22; color: white; }
    </style>
</head>
<body>
    <h1>🎵 Importação SBACEM → Woodstock</h1>

    <div class="toolbar">
        <input id="atlasId" type="text" placeholder="atlas_id (ex: AW0MTYO2)" />
        <button class="btn-preview" onclick="preview()">Preview</button>
        <button class="btn-import" onclick="importar()">Importar Obra</button>
        <span id="loading">Carregando...</span>
    </div>

    <div id="msg"></div>
    <div id="resultado"></div>

    <script>
        const LINK_COLORS = ['link-1','link-2','link-3','link-4','link-5','link-6','link-7'];

        function getLinkClass(link) {
            return LINK_COLORS[(link - 1) % LINK_COLORS.length];
        }

        function fmt(val) {
            if (val === null || val === undefined) return '0,00';
            return Number(val).toFixed(2).replace('.', ',');
        }

        function showMsg(text, ok) {
            document.getElementById('msg').innerHTML =
                `<div class="msg ${ok ? 'msg-ok' : 'msg-error'}">${text}</div>`;
        }

        async function preview() {
            const atlasId = document.getElementById('atlasId').value.trim();
            if (!atlasId) return showMsg('Informe o atlas_id', false);

            document.getElementById('loading').style.display = 'inline';
            document.getElementById('resultado').innerHTML = '';
            document.getElementById('msg').innerHTML = '';

            try {
                const res = await fetch(`/importacao/preview/${atlasId}`);
                if (!res.ok) return showMsg(`Obra não encontrada: ${atlasId}`, false);
                const data = await res.json();
                renderPreview(data);
            } catch(e) {
                showMsg('Erro ao conectar na API: ' + e.message, false);
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        async function importar() {
            const atlasId = document.getElementById('atlasId').value.trim();
            if (!atlasId) return showMsg('Informe o atlas_id', false);

            if (!confirm(`Confirma importação da obra ${atlasId}?`)) return;

            document.getElementById('loading').style.display = 'inline';
            try {
                const res = await fetch(`/importacao/obra/${atlasId}`, { method: 'POST' });
                const text = await res.text();
                showMsg(text, res.ok);
            } catch(e) {
                showMsg('Erro: ' + e.message, false);
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        function renderPreview(data) {
            const alts = data.titulosAlternativos?.length
                ? `<div class="alts">Títulos alternativos: ${data.titulosAlternativos.join(' | ')}</div>` : '';

            const totalPr = data.integrantes.reduce((s, i) => s + (i.percentualPr || 0), 0);
            const totalMr = data.integrantes.reduce((s, i) => s + (i.percentualMr || 0), 0);
            const totalSr = data.integrantes.reduce((s, i) => s + (i.percentualSr || 0), 0);
            const totalColetaPr = data.integrantes.reduce((s, i) => s + (i.coletaPr || 0), 0);
            const totalColetaMr = data.integrantes.reduce((s, i) => s + (i.coletaMr || 0), 0);
            const totalFono = data.integrantes.reduce((s, i) => s + (i.fonomecanico || 0), 0);
            const totalSincro = data.integrantes.reduce((s, i) => s + (i.sincronizacao || 0), 0);
            const totalDigital = data.integrantes.reduce((s, i) => s + (i.digital || 0), 0);
            const totalExecucaoPublica = data.integrantes.reduce((s, i) => s + (i.execucaoPublica || 0), 0);

            const rows = data.integrantes.map(i => `
                <tr>
                    <td><span class="link-badge ${getLinkClass(i.link)}">${i.link}</span></td>
                    <td>${i.nome || i.idPessoa}</td>
                    <td><span class="cat cat-${i.codCategoria}">${i.codCategoria}</span></td>
                    <td class="${i.controlado ? 'ctrl-true' : 'ctrl-false'}">${i.controlado ? '✓' : '—'}</td>
                    <td class="pct pct-pr">${fmt(i.percentualPr)}%</td>
                    <td class="pct pct-mr">${fmt(i.percentualMr)}%</td>
                    <td class="pct pct-mr">${fmt(i.percentualSr)}%</td>
                    <td class="pct pct-coleta">${fmt(i.coletaPr)}%</td>
                    <td class="pct pct-coleta">${fmt(i.coletaMr)}%</td>
                    <td class="pct pct-fono">${fmt(i.fonomecanico)}%</td>
                    <td class="pct pct-fono">${fmt(i.sincronizacao)}%</td>
                    <td class="pct pct-fono">${fmt(i.digital)}%</td>
                    <td class="pct pct-fono">${fmt(i.execucaoPublica)}%</td>
                </tr>
            `).join('');

            document.getElementById('resultado').innerHTML = `
                <div class="obra-info section">
                    <h2>${data.atlasId} — ${data.titulo}</h2>
                    <div class="obra-meta">
                        <span>ISWC: ${data.iswc || '—'}</span>
                        <span class="controle">Controle MR: ${fmt(data.controleMr)}%</span>
                        <span class="controle">Controle SR: ${fmt(data.controleSr)}%</span>
                    </div>
                    ${alts}
                </div>
                <div class="section">
                    <table>
                        <thead>
                            <tr>
                                <th>Link</th>
                                <th>Nome</th>
                                <th>Role</th>
                                <th>Ctrl</th>
                                <th class="pct">PR%</th>
                                <th class="pct">MR%</th>
                                <th class="pct">SR%</th>
                                <th class="pct">Coleta PR%</th>
                                <th class="pct">Coleta MR%</th>
                                <th class="pct">Fono%</th>
                                <th class="pct">Sincro%</th>
                                <th class="pct">Digital%</th>
                                <th class="pct">Exec. Pública%</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${rows}
                            <tr class="totals">
                                <td colspan="4">TOTAL</td>
                                <td class="pct">${fmt(totalPr)}%</td>
                                <td class="pct">${fmt(totalMr)}%</td>
                                <td class="pct">${fmt(totalSr)}%</td>
                                <td class="pct">${fmt(totalColetaPr)}%</td>
                                <td class="pct">${fmt(totalColetaMr)}%</td>
                                <td class="pct">${fmt(totalFono)}%</td>
                                <td class="pct">${fmt(totalSincro)}%</td>
                                <td class="pct">${fmt(totalDigital)}%</td>
                                <td class="pct">${fmt(totalExecucaoPublica)}%</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            `;
        }

        // Enter no input dispara preview
        document.getElementById('atlasId')?.addEventListener('keydown', e => {
            if (e.key === 'Enter') preview();
        });
    </script>
</body>
</html>
